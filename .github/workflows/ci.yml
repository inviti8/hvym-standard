name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: The example is valid
        run: python tools/validate.py examples/lantern-bot/lantern-bot.gltf examples/lantern-bot/lantern-bot.glb
      - name: The validator catches each kind of mistake
        run: python -m unittest discover -s tests -v

  babylon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The example plays in Babylon.js, and its chest button waves the arm
        working-directory: tools/babylon
        run: npm ci --no-audit --no-fund && npm run check
